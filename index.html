<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dmytro Ivanenko — Digital Marketing Expert</title>
  <meta name="description" content="Dmytro Ivanenko — Digital Marketing Expert. Paid media, tracking, automation, reporting." />

  <!-- Google Calendar Appointment Scheduling begin -->
  <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
  <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>

  <style>
    :root{
      --bg:#0e1630;
      --line: rgba(255,255,255,.12);
      --text:#f2f5ff;
      --muted:#b6c1d7;
      --accent:#6ee7ff;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --r2:28px;
      --max:1150px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      line-height:1.55;
      background:
        radial-gradient(900px 520px at 50% 12%, rgba(110,231,255,.20), transparent 62%),
        radial-gradient(1000px 560px at 50% 52%, rgba(96,165,250,.12), transparent 65%),
        radial-gradient(900px 520px at 50% 92%, rgba(110,231,255,.20), transparent 62%),
        var(--bg);
      background-attachment: fixed;
    }

    a{color:inherit; text-decoration:none}
    .container{max-width:var(--max); margin:0 auto; padding:28px 18px 90px}

    /* HERO */
    .hero{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      border-radius:var(--r2);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(8px);
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(760px 260px at 50% 20%, rgba(110,231,255,.18), transparent 60%),
        radial-gradient(700px 260px at 60% 35%, rgba(96,165,250,.14), transparent 60%);
      filter: blur(10px);
      opacity:.9;
      pointer-events:none;
    }
    .hero > *{position:relative; z-index:1}

    .hero-inner{
      padding:22px 22px 10px;
      display:grid;
      grid-template-columns: 1fr 320px;
      gap:18px;
      align-items:start;
    }

    .big-role{
      margin:0;
      font-size:42px;
      letter-spacing:-1px;
      line-height:1.05;
    }

    .lead{
      margin:26px 0 0;
      color:var(--muted);
      max-width:78ch;
      font-size:15px;
    }
    .lead p{margin:0 0 12px;}

    .highlight{
      margin:30px 0 0;
      font-size:18px;
      color:rgba(242,245,255,.96);
      font-weight:800;
      letter-spacing:-.2px;
      text-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .hero-right{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      padding-top:4px;
    }

    .avatar{
      width:200px;
      height:240px;
      object-fit:cover;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 18px 46px rgba(0,0,0,.38);
      background:transparent;
      display:block;
    }

    .right-name{
      margin:0;
      font-size:20px;
      font-weight:900;
      color:rgba(242,245,255,.98);
      text-align:center;
      letter-spacing:-.2px;
      text-shadow: 0 8px 22px rgba(0,0,0,.35);
    }

    .status{
      display:inline-flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(110,231,255,.26);
      background:rgba(110,231,255,.10);
      font-size:13px;
      width:100%;
      margin-top:18px;
    }
    .dot{
      width:9px; height:9px;
      border-radius:999px;
      background:var(--accent);
      box-shadow:0 0 0 6px rgba(110,231,255,.12);
    }

    .nav{
      padding:0 22px 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:-6px;
    }
    .pill{
      padding:9px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      font-size:13px;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .pill:hover{transform:translateY(-1px); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.20)}
    .pill.primary{
      border-color: rgba(110,231,255,.30);
      background: linear-gradient(135deg, rgba(110,231,255,.18), rgba(96,165,250,.10));
    }

    /* Sections */
    .section{
      margin-top:22px;
      padding:20px;
      border-radius:var(--r2);
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      box-shadow: 0 10px 34px rgba(0,0,0,.22);
      backdrop-filter: blur(6px);
    }

    .head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin-bottom:14px;
    }
    .h2{
      margin:0;
      font-size:22px;
      letter-spacing:-.35px;
    }
    .hint{margin:0; color:var(--muted); font-size:13px}

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }
    .span-12{grid-column: span 12}
    .span-6{grid-column: span 6}
    .span-4{grid-column: span 4}

    @media (max-width: 980px){
      .hero-inner{grid-template-columns:1fr;}
      .hero-right{order:2}
      .span-6,.span-4{grid-column: span 12}
      .big-role{font-size:36px}
      .status{margin-top:10px}
    }

    .card{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.14);
      border-radius:22px;
      overflow:hidden;
    }
    .card .pad{padding:14px}
    .kicker{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .title2{margin:0; font-size:15px; font-weight:850}

    .desc{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      max-width:110ch;
    }

    .two-col{
      margin:10px 0 0;
      padding-left:18px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:6px 28px;
    }
    .two-col li{margin:0}
    @media (max-width: 700px){
      .two-col{grid-template-columns:1fr;}
    }

    .focus-card{
      border-color: rgba(110,231,255,.30);
      background:
        radial-gradient(620px 220px at 50% 10%, rgba(110,231,255,.12), transparent 62%),
        rgba(0,0,0,.14);
    }

    details.acc{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.14);
      border-radius:22px;
      overflow:hidden;
    }
    details.acc[open]{background:rgba(0,0,0,.18)}
    summary.acc-sum{
      cursor:pointer;
      padding:14px;
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:850;
    }
    summary.acc-sum::-webkit-details-marker{display:none}
    .body{padding:0 14px 14px}
    .body p{margin:0; color:var(--muted); font-size:13px; line-height:1.5}

    .mini-card{
      margin-top:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      border-radius:18px;
      padding:12px;
    }

    .example-img{
      width:100%;
      height:auto;
      max-height:none;
      object-fit:contain;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      display:block;
      margin-top:10px;
      background:rgba(0,0,0,.10);
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:12px 0;
      border-top:1px solid rgba(255,255,255,.10);
    }
    .row:first-child{border-top:0; padding-top:2px}
    .val{white-space:nowrap; font-weight:900}

    /* Contact */
    .contact-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .cta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      font-size:13px;
      transition:transform .15s ease, background .15s ease, border-color .15s ease;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{transform:translateY(-1px); background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.20)}
    .btn.contact{
      border-color: rgba(110,231,255,.30);
      background: linear-gradient(135deg, rgba(110,231,255,.18), rgba(96,165,250,.10));
    }
    button.btn{font-family:inherit; color:inherit}

    footer{
      margin-top:22px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>

<body>
<!-- Rest of your page stays identical -->

<script>
document.getElementById("y").textContent = new Date().getFullYear();

window.dataLayer = window.dataLayer || [];

(function(){
  var btn = document.getElementById("emailBtn");
  var reveal = document.getElementById("emailReveal");
  if(!btn || !reveal) return;

  btn.addEventListener("click", function(){
    window.dataLayer.push({
      event: "email_click",
      component: "contact",
      button_id: "emailBtn"
    });

    var shown = reveal.style.display !== "none";
    reveal.style.display = shown ? "none" : "inline";
    btn.textContent = shown ? "Email" : "Hide email";
  });
})();

(function(){
  var btn = document.getElementById("meetBtn");
  var reveal = document.getElementById("meetReveal");
  var loaded = false;
  if(!btn || !reveal) return;

  btn.addEventListener("click", function(){

    window.dataLayer.push({
      event: "book_meeting_click",
      component: "contact",
      button_id: "meetBtn"
    });

    var shown = reveal.style.display !== "none";

    if (shown) {
      reveal.style.display = "none";
      btn.textContent = "Book a 15-minute call with Dmytro";
      return;
    }

    reveal.style.display = "inline-block";
    btn.textContent = "Hide appointment";

    if (!loaded) {
      loaded = true;

      var tries = 0;
      (function waitForCalendar(){
        tries++;
        if (window.calendar && calendar.schedulingButton && calendar.schedulingButton.load) {

          calendar.schedulingButton.load({
            url: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ2xDegYfKspYp_Avnot0xbHYbwbswrzzhn4paeoAhbJMy92rgsasGi9qUxjymmau0cVjXl__Fj-?gv=true',
            color: '#33B679',
            label: "Google Meet Appointment",
            target: reveal
          });

          return;
        }
        if (tries < 60) {
          setTimeout(waitForCalendar, 100);
        }
      })();
    }

  });
})();
</script>
</body>
</html>
